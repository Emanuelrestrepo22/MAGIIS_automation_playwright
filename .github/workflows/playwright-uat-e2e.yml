# ==========================================================================
#  GitHub Actions — E2E UAT (green-run de la suite en CI, fuera de OneDrive)
#
#  Por qué existe: el runner LOCAL falla bajo OneDrive (ERR_MODULE_NOT_FOUND /
#  UNKNOWN read al cargar playwright-core / @playwright/test) — es un problema del
#  filesystem de OneDrive, NO de UAT ni de los tests. En un runner Ubuntu con clone
#  fresco + pnpm install, tsc y el runner de Playwright funcionan normalmente.
#  Este workflow da el green-run consistente de TODOS los TCs contra UAT + Allure.
#
#  Modelado sobre playwright.yml (E2E TEST). Manual-only (workflow_dispatch), igual
#  que los demás workflows del repo (BL-035).
#
#  Secrets requeridos (Settings → Secrets and variables → Actions, environment UAT):
#    USER_CARRIER / PASS_CARRIER          (carrier CON API de vuelos vinculada — p/ getFlights)
#    USER_CONTRACTOR / PASS_CONTRACTOR    (portal contractor)
#  Vars (opcionales): BASE_URL (default apps-uat), AUTH_API_URL
# ==========================================================================

name: E2E Tests — UAT Environment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Selección de suite a correr'
        type: choice
        default: all
        options: [all, regression, gateway, flights, smoke]
      test_filter:
        description: 'Playwright -g pattern extra (vacío = según scope)'
        required: false
        default: ''
      xray_execution:
        description: 'Xray: key del Test Execution (ATR) destino. Vacío = crea uno nuevo con la versión.'
        required: false
        default: ''
      xray_version:
        description: 'Xray: fixVersion para la ejecución nueva (solo si xray_execution vacío)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: TypeScript compile check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm --if-present run lint

  e2e-uat:
    name: E2E UAT (${{ inputs.scope }})
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: UAT
    env:
      ENV: uat
      # HAS_XRAY habilita el reporter+import solo si el proyecto tiene creds Xray.
      # (los secrets no se pueden usar directo en `if:`; se mapean a env aquí)
      HAS_XRAY: ${{ secrets.XRAY_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers (chromium)
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: pnpm run pw:install
      - name: Install system deps for Playwright (cache hit)
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Create storage directory
        run: mkdir -p storage
      - name: Create .env.uat from secrets
        run: |
          cat > .env.uat << 'ENVEOF'
          ENV=uat
          BASE_URL=${{ vars.BASE_URL || 'https://apps-uat.magiis.com' }}
          AUTH_API_URL=${{ vars.AUTH_API_URL || '' }}
          LOGIN_PATH="/#/authentication/login/carrier"
          DASHBOARD_URL_PATTERN="dashboard"
          USER_CARRIER=${{ secrets.USER_CARRIER }}
          PASS_CARRIER=${{ secrets.PASS_CARRIER }}
          USER_CONTRACTOR=${{ secrets.USER_CONTRACTOR }}
          PASS_CONTRACTOR=${{ secrets.PASS_CONTRACTOR }}
          HEADLESS=true
          ENVEOF
          if grep -q "^USER_CARRIER=$" .env.uat || grep -q "^PASS_CARRIER=$" .env.uat; then
            echo "❌ ERROR: USER_CARRIER/PASS_CARRIER vacíos en GitHub Secrets (environment UAT)"
            exit 1
          fi
      - name: Run E2E (scope=${{ inputs.scope }})
        env:
          # XRAY=1 activa el xray-reporter (opt-in) → emite evidence/uat/xray-results.json
          XRAY: ${{ env.HAS_XRAY == 'true' && '1' || '' }}
          XRAY_EXECUTION_KEY: ${{ inputs.xray_execution }}
          XRAY_VERSION: ${{ inputs.xray_version }}
          XRAY_SUMMARY: "E2E UAT ${{ inputs.scope }} — run ${{ github.run_number }}"
        run: |
          set -e
          FILTER='${{ inputs.test_filter }}'
          run_regression() { pnpm exec playwright test --project=chromium --grep=@regression ${FILTER:+-g "$FILTER"}; }
          run_smoke()      { pnpm exec playwright test --project=chromium --grep=@smoke ${FILTER:+-g "$FILTER"}; }
          run_gateway()    { pnpm exec playwright test -c playwright.gateway-pg.config.ts --grep=@gateway ${FILTER:+-g "$FILTER"}; }
          run_flights()    { pnpm exec playwright test tests/features/flights --project=chromium ${FILTER:+-g "$FILTER"}; }
          case "${{ inputs.scope }}" in
            regression) run_regression ;;
            smoke)      run_smoke ;;
            gateway)    run_gateway ;;
            flights)    run_flights ;;
            all)        run_regression; run_gateway; run_flights ;;
          esac
      - name: Import results to Xray Cloud
        if: ${{ always() && env.HAS_XRAY == 'true' }}
        continue-on-error: true
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          RESULTS_FILE: evidence/uat/xray-results.json
        run: |
          set -e
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "⚠️  No existe $RESULTS_FILE (¿la corrida no mapeó ningún test_key?). Skip import."
            exit 0
          fi
          echo "🔑 Autenticando contra Xray Cloud..."
          TOKEN=$(curl -sf -H "Content-Type: application/json" -X POST \
            --data "{\"client_id\":\"${XRAY_CLIENT_ID}\",\"client_secret\":\"${XRAY_CLIENT_SECRET}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')
          if [ -z "$TOKEN" ]; then echo "❌ Falló autenticación Xray"; exit 1; fi
          echo "📤 Importando $(jq '.tests | length' "$RESULTS_FILE") resultado(s)..."
          HTTP=$(curl -s -o xray-import-response.json -w "%{http_code}" \
            -H "Content-Type: application/json" -H "Authorization: Bearer ${TOKEN}" \
            -X POST --data @"$RESULTS_FILE" \
            https://xray.cloud.getxray.app/api/v2/import/execution)
          echo "HTTP ${HTTP}:"; cat xray-import-response.json; echo
          [ "$HTTP" = "200" ] || { echo "❌ Import devolvió ${HTTP}"; exit 1; }
          echo "✅ Resultados importados a Xray."

      - name: Upload Xray results + response
        if: ${{ always() && env.HAS_XRAY == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xray-results-uat-${{ github.run_number }}
          path: |
            evidence/uat/xray-results.json
            xray-import-response.json
          retention-days: 14

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: pnpm run allure:gen
      - name: Cleanup UAT travels
        if: always()
        continue-on-error: true
        run: pnpm --if-present run cleanup:test:travels
      - name: Upload Allure report (always, 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-uat-${{ github.run_number }}
          path: allure-report
          retention-days: 14
      - name: Upload evidence (failures only, 7 days)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-uat-${{ github.run_number }}
          path: |
            evidence/uat
            test-results
          retention-days: 7
