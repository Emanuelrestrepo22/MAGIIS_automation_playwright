# ==========================================================================
#  GitHub Actions — E2E UAT (green-run de la suite en CI, fuera de OneDrive)
#
#  Por qué existe: el runner LOCAL falla bajo OneDrive (ERR_MODULE_NOT_FOUND /
#  UNKNOWN read al cargar playwright-core / @playwright/test) — es un problema del
#  filesystem de OneDrive, NO de UAT ni de los tests. En un runner Ubuntu con clone
#  fresco + pnpm install, tsc y el runner de Playwright funcionan normalmente.
#  Este workflow da el green-run consistente de TODOS los TCs contra UAT + Allure.
#
#  Modelado sobre playwright.yml (E2E TEST). Manual-only (workflow_dispatch), igual
#  que los demás workflows del repo (BL-035).
#
#  Secrets requeridos (Settings → Secrets and variables → Actions, environment UAT):
#    USER_CARRIER / PASS_CARRIER          (carrier CON API de vuelos vinculada — p/ getFlights)
#    USER_CONTRACTOR / PASS_CONTRACTOR    (portal contractor)
#  Vars (opcionales): BASE_URL (default apps-uat), AUTH_API_URL
# ==========================================================================

name: E2E Tests — UAT Environment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Selección de suite a correr'
        type: choice
        default: all
        options: [all, regression, gateway, flights, smoke]
      test_filter:
        description: 'Playwright -g pattern extra (vacío = según scope)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: TypeScript compile check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm --if-present run lint

  e2e-uat:
    name: E2E UAT (${{ inputs.scope }})
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: UAT
    env:
      ENV: uat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers (chromium)
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: pnpm run pw:install
      - name: Install system deps for Playwright (cache hit)
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Create storage directory
        run: mkdir -p storage
      - name: Create .env.uat from secrets
        run: |
          cat > .env.uat << 'ENVEOF'
          ENV=uat
          BASE_URL=${{ vars.BASE_URL || 'https://apps-uat.magiis.com' }}
          AUTH_API_URL=${{ vars.AUTH_API_URL || '' }}
          LOGIN_PATH="/#/authentication/login/carrier"
          DASHBOARD_URL_PATTERN="dashboard"
          USER_CARRIER=${{ secrets.USER_CARRIER }}
          PASS_CARRIER=${{ secrets.PASS_CARRIER }}
          USER_CONTRACTOR=${{ secrets.USER_CONTRACTOR }}
          PASS_CONTRACTOR=${{ secrets.PASS_CONTRACTOR }}
          HEADLESS=true
          ENVEOF
          if grep -q "^USER_CARRIER=$" .env.uat || grep -q "^PASS_CARRIER=$" .env.uat; then
            echo "❌ ERROR: USER_CARRIER/PASS_CARRIER vacíos en GitHub Secrets (environment UAT)"
            exit 1
          fi
      - name: Run E2E (scope=${{ inputs.scope }})
        run: |
          set -e
          FILTER='${{ inputs.test_filter }}'
          run_regression() { pnpm exec playwright test --project=chromium --grep=@regression ${FILTER:+-g "$FILTER"}; }
          run_smoke()      { pnpm exec playwright test --project=chromium --grep=@smoke ${FILTER:+-g "$FILTER"}; }
          run_gateway()    { pnpm exec playwright test -c playwright.gateway-pg.config.ts --grep=@gateway ${FILTER:+-g "$FILTER"}; }
          run_flights()    { pnpm exec playwright test tests/features/flights --project=chromium ${FILTER:+-g "$FILTER"}; }
          case "${{ inputs.scope }}" in
            regression) run_regression ;;
            smoke)      run_smoke ;;
            gateway)    run_gateway ;;
            flights)    run_flights ;;
            all)        run_regression; run_gateway; run_flights ;;
          esac
      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: pnpm run allure:gen
      - name: Cleanup UAT travels
        if: always()
        continue-on-error: true
        run: pnpm --if-present run cleanup:test:travels
      - name: Upload Allure report (always, 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-uat-${{ github.run_number }}
          path: allure-report
          retention-days: 14
      - name: Upload evidence (failures only, 7 days)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-uat-${{ github.run_number }}
          path: |
            evidence/uat
            test-results
          retention-days: 7
